[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "filetype-size-azure-storage"
version = "2.0.0"
description = "Calculate total byte size of blobs by file extension in Azure Blob Storage"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Joel Shearon" }]
dependencies = [
    "azure-storage-blob>=12.24.0,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[project.scripts]
filetype-size-azure = "filetype_size.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["filetype_size*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["filetype_size"]
